[project]
name = "idm-downloader"
version = "0.2.0"
description = "Multi-connection download manager with video and social site support"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Lavati Softwares" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.31",
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "yt-dlp>=2025.1.1",
    # the torrent engine; no release for Python 3.14 yet, where the Torrents screen explains it is unavailable
    "libtorrent>=2.0.9; python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/yuvarajkanesan/LavatiDownloader"
Issues = "https://github.com/yuvarajkanesan/LavatiDownloader/issues"

[project.optional-dependencies]
dev = [
    "imageio-ffmpeg>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
idm = "idm.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
