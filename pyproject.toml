[project]
name = "idm-downloader"
version = "0.2.0"
description = "Multi-connection download manager with video and social site support"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "yt-dlp>=2025.1.1",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
idm = "idm.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
